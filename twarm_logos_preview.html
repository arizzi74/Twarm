<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Twarm Logo Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #090A0D;
      color: #E2E8F0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 40px;
    }
    .card {
      background: #111318;
      border: 1px solid #1E293B;
      border-radius: 16px;
      padding: 32px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .label {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748B;
    }
    .sizes {
      display: flex;
      align-items: center;
      gap: 24px;
    }
  </style>
</head>
<body>

  <!-- Full Horizontal Logo -->
  <div class="card">
    <span class="label">Full Horizontal Logo (README & Navbar)</span>
    <svg xmlns="http://w3.org" width="460" height="128" viewBox="0 0 460 128" fill="none">
      <g transform="translate(8, 0)">
        <path d="M80 28.5L64 19.5L26 41.5V86.5L64 108.5L102 86.5V66" stroke="#B5F53A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        <polygon points="101,25 87,49 115,49" fill="#B5F53A"/>
        <path d="M45 50L59 64L45 78" stroke="#B5F53A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        <line x1="65" y1="78" x2="83" y2="78" stroke="#B5F53A" stroke-width="8" stroke-linecap="square"/>
      </g>
      <g fill="#B5F53A" transform="translate(148, 41)">
        <path d="M0 0H44V8.5H26.5V46H17.5V8.5H0V0Z"/>
        <path d="M52 0H61.5L70.5 32.5L79.5 0H88.5L97.5 32.5L106.5 0H116L102.5 46H93.5L84 14L74.5 46H65.5L52 0Z"/>
        <path d="M139 0H149L168 46H158.5L154 35H134L129.5 46H120L139 0ZM137 27H151L144 9.5L137 27Z"/>
        <path d="M178 0H202C211.5 0 217.5 5.5 217.5 14C217.5 20.5 213.5 25.5 207 27L218.5 46H208L197.5 28H187V46H178V0ZM187 8V20.5H201C205.5 20.5 208.5 18 208.5 14.25C208.5 10.5 205.5 8 201 8H187Z"/>
        <path d="M230 0H240L256 27L272 0H282V46H273V15L258.5 38.5H253.5L239 15V46H230V0Z"/>
      </g>
    </svg>
  </div>

  <!-- Square App Icons at Multiple Sizes -->
  <div class="card">
    <span class="label">App Icon & Favicon Scale Test (128px, 64px, 32px)</span>
    <div class="sizes">
      <svg xmlns="http://w3.org" width="128" height="128" viewBox="0 0 128 128" fill="none">
        <rect width="128" height="128" rx="28" fill="#0D0F12"/>
        <path d="M80 28.5L64 19.5L26 41.5V86.5L64 108.5L102 86.5V66" stroke="#B5F53A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        <polygon points="101,25 87,49 115,49" fill="#B5F53A"/>
        <path d="M45 50L59 64L45 78" stroke="#B5F53A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        <line x1="65" y1="78" x2="83" y2="78" stroke="#B5F53A" stroke-width="8" stroke-linecap="square"/>
      </svg>

      <svg xmlns="http://w3.org" width="64" height="64" viewBox="0 0 128 128" fill="none">
        <rect width="128" height="128" rx="28" fill="#0D0F12"/>
        <path d="M80 28.5L64 19.5L26 41.5V86.5L64 108.5L102 86.5V66" stroke="#B5F53A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        <polygon points="101,25 87,49 115,49" fill="#B5F53A"/>
        <path d="M45 50L59 64L45 78" stroke="#B5F53A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        <line x1="65" y1="78" x2="83" y2="78" stroke="#B5F53A" stroke-width="8" stroke-linecap="square"/>
      </svg>

      <svg xmlns="http://w3.org" width="32" height="32" viewBox="0 0 128 128" fill="none">
        <rect width="128" height="128" rx="28" fill="#0D0F12"/>
        <path d="M80 28.5L64 19.5L26 41.5V86.5L64 108.5L102 86.5V66" stroke="#B5F53A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        <polygon points="101,25 87,49 115,49" fill="#B5F53A"/>
        <path d="M45 50L59 64L45 78" stroke="#B5F53A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        <line x1="65" y1="78" x2="83" y2="78" stroke="#B5F53A" stroke-width="8" stroke-linecap="square"/>
      </svg>
    </div>
  </div>

</body>
</html>
